[project]
name = "lexweft-lite"
version = "0.4.3"
description = "資料を蓄積し、LLM 向けの Markdown に変換し、課題と解決手段のつながり (意味層) を作って見て、MCP から引けるローカルアプリ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "mcp>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.scripts]
lexweft = "lexweft_lite.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lexweft_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
